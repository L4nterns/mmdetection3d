[project]
name = "mmdetection3d-labelcloud-host-tools"
version = "0.1.0"
description = "Host-side utilities for labelCloud visualization, cropping, and tests."
requires-python = ">=3.10,<3.12"
dependencies = []

[dependency-groups]
labelcloud-host = [
    "numpy>=1.23",
    "open3d>=0.18",
]
test = [
    "numpy>=1.23",
    "pytest>=7",
]

[tool.uv]
package = false
default-groups = ["test"]
